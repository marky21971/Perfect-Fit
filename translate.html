<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Translate — M. A. Harrington</title>

  <style>
    body {
      font-family: Georgia, serif;
      background-color: #1a1a2e;
      color: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .home-button {
      display: inline-block;
      padding: 13px 30px;
      border-radius: 30px;
      background-color: #f2a65a;
      color: #1a1a2e;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05em;
      margin-bottom: 35px;
    }

    .home-button:hover {
      background-color: #ffbb70;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 5px;
    }

    h2 {
      color: #f2a65a;
      font-weight: normal;
      margin-top: 0;
    }

    .message {
      max-width: 650px;
      margin: 25px auto;
      line-height: 1.7;
      color: #d8d8d8;
      font-size: 1.05em;
    }

    .translate-button {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 34px;
      border-radius: 30px;
      background-color: #f2a65a;
      color: #1a1a2e;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.15em;
    }

    .translate-button:hover {
      background-color: #ffbb70;
    }

    .bottom-home {
      margin-top: 50px;
    }

    footer {
      margin-top: 70px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #aaa;
      font-size: 0.9em;
    }
  </style>
</head>

<body>

  <a href="index.html" class="home-button">
    🏠 Home
  </a>

  <h1>Translate</h1>

  <h2>Perfect Fit</h2>

  <p class="message">
    Enjoy this story in the language that's right for you. 🌍
  </p>

  <p class="message">
    When you're ready, choose your language and translate your book.
  </p>

  <a
    href="https://translate.google.com/"
    target="_blank"
    class="translate-button"
  >
    🌍 Translate My Book
  </a>

  <div class="bottom-home">

    <a href="index.html" class="home-button">
      🏠 Home
    </a>

  </div>

  <footer>
    © M. A. Harrington
  </footer>

</body>
</html>
