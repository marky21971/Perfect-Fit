<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Fit — Translation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #fff7fb;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
        text-align: center;
        color: #c2185b;
        margin-bottom: 10px;
    }

    .intro {
        text-align: center;
        margin-bottom: 25px;
        color: #666;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    textarea,
    select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        margin-bottom: 18px;
    }

    textarea {
        min-height: 180px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #c2185b;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    #result {
        margin-top: 25px;
        padding: 15px;
        background: #fff0f6;
        border-radius: 10px;
        min-height: 80px;
        white-space: pre-wrap;
    }

    .status {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
        color: #777;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #c2185b;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    .book-section {
        margin-top: 30px;
    }

    .book-section h2 {
        color: #c2185b;
    }

    iframe {
        width: 100%;
        height: 700px;
        border: 1px solid #ccc;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Perfect Fit</h1>

    <p class="intro">
        Translation Assistant
    </p>

    <label for="language">Choose a language</label>

    <select id="language">
        <option value="ES">Spanish</option>
        <option value="FR">French</option>
        <option value="DE">German</option>
        <option value="IT">Italian</option>
        <option value="PT">Portuguese</option>
        <option value="SW">Swahili</option>
        <option value="YO">Yoruba</option>
        <option value="IG">Igbo</option>
        <option value="HA">Hausa</option>
        <option value="TL">Filipino</option>
    </select>

    <label for="text">Enter text to translate</label>

    <textarea
        id="text"
        placeholder="Type or paste your text here..."
    ></textarea>

    <button type="button" id="translateButton">
        Translate
    </button>

    <div id="result">
        Your translation will appear here.
    </div>

    <div class="status" id="status"></div>

    <a class="back-link" href="index.html">
        Back to Perfect Fit
    </a>

    <div class="book-section">

        <h2>Perfect Fit</h2>

        <iframe
            src="perfect-fit.pdf"
            title="Perfect Fit Book">
        </iframe>

    </div>

</div>

<script>
document.getElementById("translateButton").addEventListener("click", translateText);

async function translateText() {

    const text = document.getElementById("text").value.trim();
    const language = document.getElementById("language").value;
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const button = document.getElementById("translateButton");

    if (!text) {
        result.textContent = "Please enter some text to translate.";
        status.textContent = "";
        return;
    }

    result.textContent = "Translating...";
    status.textContent = "Connecting to translation service...";
    button.disabled = true;
    button.textContent = "Translating...";

    try {

        const response = await fetch(
            "https://perfect-fit.imaleo234.workers.dev/api/translate",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text,
                    targetLang: language
                })
            }
        );

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error(
                "The translation server returned an invalid response."
            );
        }

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Translation service returned an error."
            );
        }

        if (!data.translation) {
            throw new Error(
                "No translation was returned."
            );
        }

        result.textContent = data.translation;
        status.textContent = "Translation complete.";

    } catch (error) {

        console.error("Translation error:", error);

        result.textContent =
            "Translation failed: " + error.message;

        status.textContent =
            "Please try again.";

    } finally {

        button.disabled = false;
        button.textContent = "Translate";
    }
}
</script>

</body>
</html>
