
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Fit — Translation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #fff7fb;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
        text-align: center;
        color: #c2185b;
        margin-bottom: 10px;
    }

    .intro {
        text-align: center;
        margin-bottom: 25px;
        color: #666;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    textarea,
    select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        margin-bottom: 18px;
    }

    textarea {
        min-height: 180px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #c2185b;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    #result {
        margin-top: 25px;
        padding: 15px;
        background: #fff0f6;
        border-radius: 10px;
        min-height: 80px;
        white-space: pre-wrap;
    }

    .status {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
        color: #777;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Perfect Fit</h1>

    <p class="intro">
        Translation Assistant
    </p>

    <label for="language">Choose a language</label>

    <select id="language">
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="sw">Swahili</option>
        <option value="yo">Yoruba</option>
        <option value="ig">Igbo</option>
        <option value="ha">Hausa</option>
        <option value="tl">Filipino</option>
    </select>

    <label for="text">Enter text to translate</label>

    <textarea id="text" placeholder="Type or paste your text here..."></textarea>

    <button onclick="translateText()">Translate</button>

    <div id="result">
        Your translation will appear here.
    </div>

    <div class="status" id="status"></div>

</div>

<script>
async function translateText() {

    const text = document.getElementById("text").value.trim();
    const language = document.getElementById("language").value;
    const result = document.getElementById("result");
    const status = document.getElementById("status");

    if (!text) {
        result.textContent = "Please enter some text to translate.";
        return;
    }

    result.textContent = "Translating...";
    status.textContent = "";

    const languageNames = {
        es: "Spanish",
        fr: "French",
        de: "German",
        it: "Italian",
        pt: "Portuguese",
        sw: "Swahili",
        yo: "Yoruba",
        ig: "Igbo",
        ha: "Hausa",
        tl: "Filipino"
    };

    try {

        const response = await fetch("/api/translate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
           body: JSON.stringify({
    text: text,
    targetLang: language.toUpperCase()
})
            })
        });

        if (!response.ok) {
            throw new Error("Translation service returned an error.");
        }

        const data = await response.json();

        if (!data.translation) {
            throw new Error("No translation was returned.");
        }

        result.textContent = data.translation;
        status.textContent = "Translation complete.";

    } catch (error) {

        console.error(error);

        result.textContent =
            "The translation could not be completed. Please try again.";

        status.textContent = "Translation error.";
    }
}
</script>
<div style="margin-top:30px;">
  <h2>Perfect Fit</h2>
  <iframe
    src="perfect-fit.pdf"
    width="100%"
    height="700"
    style="border:1px solid #ccc; border-radius:10px;">
  </iframe>
</div>
</body>
</html>
