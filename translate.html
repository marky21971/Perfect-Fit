<div class="container">

    <!-- EASY WAY HOME -->
    <a href="index.html" class="home-button">
        ← Back to Home
    </a>

    <h1>Perfect Fit</h1>

    <h2>Translation Assistant</h2>

    <div class="translator-box">

        <label for="language">
            Choose your language
        </label>

        <select id="language">
            <option value="ES">Spanish</option>
            <option value="FR">French</option>
            <option value="DE">German</option>
            <option value="IT">Italian</option>
            <option value="PT">Portuguese</option>
        </select>

        <label for="text">
            Enter text to translate
        </label>

        <textarea
            id="text"
            placeholder="Type or paste the text you would like translated here..."
        ></textarea>

        <button id="translateButton">
            🌍 TRANSLATE
        </button>

        <div id="result">
            Your translation will appear here.
        </div>

        <div class="note">
            More languages can be added as we expand the translation system.
        </div>

    </div>

    <div class="book-title">
        Read Perfect Fit
    </div>

    <iframe
        src="perfect-fit.pdf"
        title="Perfect Fit Book">
    </iframe>

</div>

<script>
const translateButton = document.getElementById("translateButton");
const textBox = document.getElementById("text");
const languageBox = document.getElementById("language");
const resultBox = document.getElementById("result");

translateButton.addEventListener("click", async function () {

    const text = textBox.value.trim();
    const language = languageBox.value;

    if (!text) {
        resultBox.textContent = "Please enter some text to translate.";
        return;
    }

    translateButton.disabled = true;
    translateButton.textContent = "Translating...";
    resultBox.textContent = "Please wait...";

    try {

        const response = await fetch(
            "https://perfect-fit.imaleo234.workers.dev/api/translate",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text,
                    targetLang: language
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Translation failed."
            );
        }

        resultBox.textContent =
            data.translation || "No translation was returned.";

    } catch (error) {

        resultBox.textContent =
            "Translation failed: " + error.message;

    } finally {

        translateButton.disabled = false;
        translateButton.textContent = "🌍 TRANSLATE";
    }
});
</script>

</body>
