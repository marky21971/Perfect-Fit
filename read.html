<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Read Perfect Fit — M. A. Harrington</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #1a1a2e;
      color: #f8f1e5;
      text-align: center;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    header a {
      color: #f2a65a;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    h1 {
      color: #f2a65a;
      margin-bottom: 10px;
    }

    .intro {
      margin-bottom: 25px;
    }

    .book-viewer {
      width: 100%;
      height: 75vh;
      min-height: 600px;
      border: none;
      border-radius: 10px;
      background: white;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .button {
      display: inline-block;
      margin: 20px 8px 10px;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }

    .download {
      background: #f2a65a;
      color: #1a1a2e;
    }

    .back {
      background: white;
      color: #1a1a2e;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.15);
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 10px 40px;
      }

      .book-viewer {
        height: 70vh;
        min-height: 500px;
      }

      .button {
        display: block;
        max-width: 320px;
        margin: 12px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="library.html">← Back to My Story Library</a>
  </header>

  <main class="container">

    <h1>📖 Perfect Fit</h1>

    <p class="intro">
      By M.A. Harrington
    </p>

    <iframe
      class="book-viewer"
      src="perfect-fit.pdf"
      title="Read Perfect Fit"
    ></iframe>

    <div>
      <a
        href="perfect-fit.pdf"
        class="button download"
        download
      >
        ⬇️ Download the Full Book
      </a>

      <a
        href="library.html"
        class="button back"
      >
        ← Back to Story Library
      </a>
    </div>

    <footer>
      Copyright © 2026 M.A. Harrington. All rights reserved.
    </footer>

  </main>

</body>
</html>
