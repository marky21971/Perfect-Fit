<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Story Preview</title>

  <style>
    body {
      font-family: Georgia, serif;
      background-color: #1a1a2e;
      color: #f5f5f5;
      margin: 0;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 5px;
    }

    h2 {
      font-weight: normal;
      color: #f2a65a;
      margin-top: 0;
    }

    .home-button {
      display: inline-block;
      margin: 10px 0 30px;
      padding: 12px 28px;
      border-radius: 30px;
      background-color: #f2a65a;
      color: #1a1a2e;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05em;
    }

    .home-button:hover {
      background-color: #ffbb70;
    }

    .message {
      max-width: 650px;
      margin: 0 auto 25px;
      line-height: 1.6;
      color: #d8d8d8;
    }

    .preview-box {
      max-width: 850px;
      margin: 0 auto;
    }

    .preview-box iframe {
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 10px;
      background-color: white;
    }

    .buy-message {
      margin: 30px auto;
      max-width: 650px;
      font-size: 1.1em;
      line-height: 1.6;
    }

    .buy-button {
      display: inline-block;
      padding: 15px 32px;
      border-radius: 30px;
      background-color: #f2a65a;
      color: #1a1a2e;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
    }

    .buy-button:hover {
      background-color: #ffbb70;
    }
  </style>
</head>

<body>

  <a href="index.html" class="home-button">
    🏠 Home
  </a>

  <h1>Story Title</h1>

  <h2>by M. A. Harrington</h2>

  <p class="message">
    Enjoy a preview of this story.
  </p>

  <div class="preview-box">
    <iframe
      src="perfect-fit-preview-final.pdf"
      title="Story Preview"
    ></iframe>
  </div>

  <div class="buy-message">
    <p>
      Ready to read the complete story?
    </p>

    <a
      href="#"
      class="buy-button"
    >
      💛 Buy the Complete Story
    </a>
  </div>

  <br>

  <a href="index.html" class="home-button">
    🏠 Home
  </a>

</body>
</html>
